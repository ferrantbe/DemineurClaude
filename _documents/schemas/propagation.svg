242.0" font-family="Calibri, Arial, sans-serif" font-size="18" fill="#1F4E79" text-anchor="middle" dominant-baseline="central">1</text><rect x="104" y="216" width="52" height="52" fill="#F2F2F2" stroke="#AAA"/><text x="130.0" y="242.0" font-family="Calibri, Arial, sans-serif" font-size="18" fill="#1F4E79" text-anchor="middle" dominant-baseline="central">1</text><rect x="156" y="216" width="52" height="52" fill="#F2F2F2" stroke="#AAA"/><rect x="208" y="216" width="52" height="52" fill="#F2F2F2" stroke="#AAA"/><path d="M234.0 242.0 L234.0 261.55 L239.175 256.95 L242.625 265.0 L246.075 263.275 L242.625 255.225 L248.375 255.225 Z" fill="white" stroke="#222" stroke-width="1.6" stroke-linejoin="round"/><rect x="260" y="216" width="52" height="52" fill="#F2F2F2" stroke="#AAA"/><rect x="52" y="268" width="52" height="52" fill="#DADADA" stroke="#AAA"/><circle cx="78.0" cy="294.0" r="8.32" fill="#B03030"/><line x1="63.856" y1="294.0" x2="92.144" y2="294.0" stroke="#B03030" stroke-width="2"/><line x1="78.0" y1="279.856" x2="78.0" y2="308.144" stroke="#B03030" stroke-width="2"/><line x1="67.99868168689747" y1="283.9986816868975" x2="88.00131831310253" y2="304.0013183131025" stroke="#B03030" stroke-width="2"/><line x1="67.99868168689747" y1="304.0013183131025" x2="88.00131831310253" y2="283.9986816868975" stroke="#B03030" stroke-width="2"/><rect x="104" y="268" width="52" height="52" fill="#F2F2F2" stroke="#AAA"/><text x="130.0" y="294.0" font-family="Calibri, Arial, sans-serif" font-size="18" fill="#1F4E79" text-anchor="middle" dominant-baseline="central">1</text><rect x="156" y="268" width="52" height="52" fill="#F2F2F2" stroke="#AAA"/><rect x="208" y="268" width="52" height="52" fill="#F2F2F2" stroke="#AAA"/><rect x="260" y="268" width="52" height="52" fill="#F2F2F2" stroke="#AAA"/><text x="352" y="78" font-family="Calibri, Arial, sans-serif" font-size="15" fill="#222">La case cliquée n’a aucune mine</text><text x="352" y="100" font-family="Calibri, Arial, sans-serif" font-size="15" fill="#222">voisine : ses huit voisines</text><text x="352" y="122" font-family="Calibri, Arial, sans-serif" font-size="15" fill="#222">s’ouvrent à leur tour.</text><text x="352" y="144" font-family="Calibri, Arial, sans-serif" font-size="15" fill="#222"></text><text x="352" y="166" font-family="Calibri, Arial, sans-serif" font-size="15" fill="#222">Une voisine sans mine voisine</text><text x="352" y="188" font-family="Calibri, Arial, sans-serif" font-size="15" fill="#222">propage encore ; une voisine</text><text x="352" y="210" font-family="Calibri, Arial, sans-serif" font-size="15" fill="#222">avec un chiffre s’ouvre, puis</text><text x="352" y="232" font-family="Calibri, Arial, sans-serif" font-size="15" fill="#222">s’arrête : le chiffre borde la zone.</text><text x="352" y="254" font-family="Calibri, Arial, sans-serif" font-size="15" fill="#222"></text><text x="352" y="276" font-family="Calibri, Arial, sans-serif" font-size="15" fill="#222">Les cases encore grises n’ont</text><text x="352" y="298" font-family="Calibri, Arial, sans-serif" font-size="15" fill="#222">jamais été visitées : la propagation</text><text x="352" y="320" font-family="Calibri, Arial, sans-serif" font-size="15" fill="#222">ne traverse pas un chiffre.</text></svg>