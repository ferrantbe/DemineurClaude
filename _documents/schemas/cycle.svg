<svg xmlns="http://www.w3.org/2000/svg" width="640" height="265" viewBox="0 0 640 265"><rect width="640" height="265" fill="white"/><rect x="20" y="48" width="120" height="44" rx="8" fill="#F2F2F2" stroke="#1F4E79"/><text x="80" y="70" font-family="Consolas, Menlo, monospace" font-size="15" fill="#8B2500" text-anchor="middle" dominant-baseline="central">CACHEE</text><rect x="200" y="48" width="120" height="44" rx="8" fill="#F2F2F2" stroke="#1F4E79"/><text x="260" y="70" font-family="Consolas, Menlo, monospace" font-size="15" fill="#8B2500" text-anchor="middle" dominant-baseline="central">DRAPEAU</text><rect x="380" y="48" width="120" height="44" rx="8" fill="#F2F2F2" stroke="#1F4E79"/><text x="440" y="70" font-family="Consolas, Menlo, monospace" font-size="15" fill="#8B2500" text-anchor="middle" dominant-baseline="central">DOUTE</text><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1F4E79"/></marker></defs><line x1="140" y1="70" x2="200" y2="70" stroke="#1F4E79" stroke-width="2" marker-end="url(#a)"/><line x1="320" y1="70" x2="380" y2="70" stroke="#1F4E79" stroke-width="2" marker-end="url(#a)"/><path d="M440 92 C 440 150, 80 150, 80 94" fill="none" stroke="#1F4E79" stroke-width="2" marker-end="url(#a)"/><text x="260.0" y="158" font-family="Calibri, Arial, sans-serif" font-size="14" fill="#595959" text-anchor="middle">chaque clic droit passe à l’état suivant</text><rect x="20" y="190" width="120" height="44" rx="8" fill="white" stroke="#AAA"/><text x="80" y="212" font-family="Consolas, Menlo, monospace" font-size="15" fill="#595959" text-anchor="middle" dominant-baseline="central">DECOUVERTE</text><text x="160" y="212" font-family="Calibri, Arial, sans-serif" font-size="14" fill="#222" dominant-baseline="central">un clic droit n’y change rien, et on n’en sort jamais</text><text x="260" y="30" font-family="Calibri, Arial, sans-serif" font-size="14" fill="#595959" text-anchor="middle">bloque le clic gauche et la propagation</text><text x="510" y="62" font-family="Calibri, Arial, sans-serif" font-size="14" fill="#595959">se découvre</text><text x="510" y="80" font-family="Calibri, Arial, sans-serif" font-size="14" fill="#595959">comme CACHEE</text></svg>