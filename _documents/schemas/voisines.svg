<svg xmlns="http://www.w3.org/2000/svg" width="600" height="290" viewBox="0 0 600 290"><rect width="600" height="290" fill="white"/><text x="40" y="25" font-family="Calibri, Arial, sans-serif" font-size="16" fill="#595959">Autour de la case (l, c) : les décalages (dl, dc)</text><rect x="40" y="50" width="70" height="70" fill="#F2F2F2" stroke="#999"/><text x="75.0" y="85.0" font-family="Consolas, Menlo, monospace" font-size="15" fill="#8B2500" text-anchor="middle" dominant-baseline="central">(-1,-1)</text><rect x="110" y="50" width="70" height="70" fill="#F2F2F2" stroke="#999"/><text x="145.0" y="85.0" font-family="Consolas, Menlo, monospace" font-size="15" fill="#8B2500" text-anchor="middle" dominant-baseline="central">(-1,+0)</text><rect x="180" y="50" width="70" height="70" fill="#F2F2F2" stroke="#999"/><text x="215.0" y="85.0" font-family="Consolas, Menlo, monospace" font-size="15" fill="#8B2500" text-anchor="middle" dominant-baseline="central">(-1,+1)</text><rect x="40" y="120" width="70" height="70" fill="#F2F2F2" stroke="#999"/><text x="75.0" y="155.0" font-family="Consolas, Menlo, monospace" font-size="15" fill="#8B2500" text-anchor="middle" dominant-baseline="central">(+0,-1)</text><rect x="110" y="120" width="70" height="70" fill="#DCE6F1" stroke="#1F4E79"/><text x="145.0" y="155.0" font-family="Consolas, Menlo, monospace" font-size="15" fill="#222" text-anchor="middle" dominant-baseline="central">(l, c)</text><rect x="180" y="120" width="70" height="70" fill="#F2F2F2" stroke="#999"/><text x="215.0" y="155.0" font-family="Consolas, Menlo, monospace" font-size="15" fill="#8B2500" text-anchor="middle" dominant-baseline="central">(+0,+1)</text><rect x="40" y="190" width="70" height="70" fill="#F2F2F2" stroke="#999"/><text x="75.0" y="225.0" font-family="Consolas, Menlo, monospace" font-size="15" fill="#8B2500" text-anchor="middle" dominant-baseline="central">(+1,-1)</text><rect x="110" y="190" width="70" height="70" fill="#F2F2F2" stroke="#999"/><text x="145.0" y="225.0" font-family="Consolas, Menlo, monospace" font-size="15" fill="#8B2500" text-anchor="middle" dominant-baseline="central">(+1,+0)</text><rect x="180" y="190" width="70" height="70" fill="#F2F2F2" stroke="#999"/><text x="215.0" y="225.0" font-family="Consolas, Menlo, monospace" font-size="15" fill="#8B2500" text-anchor="middle" dominant-baseline="central">(+1,+1)</text><text x="290" y="75" font-family="Calibri, Arial, sans-serif" font-size="16" fill="#222">La voisine de décalage (dl, dc)</text><text x="290" y="100" font-family="Calibri, Arial, sans-serif" font-size="16" fill="#222">est la case</text><text x="290" y="128" font-family="Consolas, Menlo, monospace" font-size="16" fill="#8B2500">(ligne + dl, colonne + dc)</text><text x="290" y="170" font-family="Calibri, Arial, sans-serif" font-size="16" fill="#222">Le décalage (0, 0) est la case</text><text x="290" y="195" font-family="Calibri, Arial, sans-serif" font-size="16" fill="#222">elle-même : on la saute.</text><text x="290" y="235" font-family="Calibri, Arial, sans-serif" font-size="16" fill="#222">Deux boucles, de -1 à +1,</text><text x="290" y="260" font-family="Calibri, Arial, sans-serif" font-size="16" fill="#222">parcourent les neuf décalages.</text></svg>